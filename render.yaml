# One Hit Wonder owner pilot. Do not open public signups until a durable database
# and media storage, email verification, abuse controls and live billing are set.
services:
  - type: web
    name: one-hit-wonder-iconent
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python3 server.py"
    healthCheckPath: /healthz
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: BUSINESS_MODE
        value: "1"
      - key: COOKIE_SECURE
        value: "1"
      - key: SIGNUPS_ENABLED
        value: "0"
      - key: CHECKOUT_ENABLED
        value: "0"
      - key: OWNER_EMAIL
        sync: false
      - key: OWNER_INVITE_CODE
        sync: false
      - key: FAL_KEY
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
